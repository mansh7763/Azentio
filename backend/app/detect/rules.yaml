# Detection defaults. UI edits are stored as overrides (A persists them) and merged on top.
# Weights are noisy-OR inputs (0-1). No single weight may reach 0.70, so no indicator is High on its own.

bands:
  medium: 40
  high: 70

floors:
  ato_full: 85      # failed logins -> success -> new device -> high-value transfer
  ato_movement: 70  # failed logins -> success -> beneficiary change or transfer
  ato_partial: 55   # failed logins -> success -> new device or reset, no money moved (capped below High)
  loan_mule: 80     # shared-identity applications -> rapid cash-out (AP-03, P1)

windows:
  chain_hours: 0.5                # revision 4: one 30-minute window for the takeover pattern
  link_minutes: 30                # txn -> device via the customer's last successful login
  burst_minutes: 10               # revision 4: >=5 failures in 10 minutes
  success_after_burst_minutes: 30

min_history: 5                    # TX-03 / DV-03 need this many prior events of that kind
floor_amount: 100                 # minimum baseline denominator, in data currency

indicators:
  TX-01: {weight: 0.45, params: {z_min: 3.0}}                # amount far above own norm
  TX-02: {weight: 0.30, enabled: false, params: {median_multiple: 2.0}}  # off: duplicates TX-01 (revision 4)
  TX-03: {weight: 0.25}                                      # new beneficiary
  TX-04: {weight: 0.40, params: {count: 5, minutes: 20}}     # velocity: >=5 transfers in 20 minutes (revision 4)
  TX-05: {weight: 0.45, params: {new_payees: 4, hours: 24}}  # fan-out to new payees
  HV-01: {weight: 0.0, params: {threshold: null, quantile: 0.90, min_samples: 20}}  # chain input only; p90 of EARLIER same-currency transfers
  DV-01: {weight: 0.45, params: {min_customers: 3, days: 30}}  # >=3 customers on one device within 30 days; with DV-02 a ring reaches High
  DV-02: {weight: 0.50}                                      # raised from 0.35: unrelated customers + apps on one device
  DV-03: {weight: 0.25}                                      # new device for this customer
  LG-01: {weight: 0.30, params: {failures: 5}}               # failed-login burst
  LG-02: {weight: 0.35}                                      # success after the burst
  LG-03: {weight: 0.35}                                      # sensitive action after a suspicious login
  AP-01: {weight: 0.55, params: {min_applicants: 3, window_hours: 72}}  # same device + shared contact/payout, >=3 applicants in 72h
  AP-02: {weight: 0.30, params: {count: 3, days: 7}}         # application velocity
  AP-03: {weight: 0.50, params: {share: 0.7, hours: 48}}     # loan disbursement -> >=70% to new recipients in 48h (P1, F04)
  ID-01: {weight: 0.35}                                      # application contact differs from profile and is reused by others
  AP-04: {weight: 0.45, params: {min_applicants: 3, days: 7}}  # >=3 applicants name one payout account, any devices (evasion of AP-01)
  ID-02: {weight: 0.40}                                      # profile contact shared with another name (F01); 0.30 -> 0.40 on D2: it fires on a loan application, F01's corroboration
  # Issue #6: frauds that stay under per-payment rules. Weights < 0.70; each needs corroboration for High.
  TX-06: {weight: 0.40, params: {windows_hours: [24, 168], quantile: 0.95, min_windows: 5, min_ratio: 1.5}}  # rolling total >= 1.5x own p95 (F10)
  TX-07: {weight: 0.40, params: {count: 3, hours: 24, low: 0.75, high: 1.0, min_z: 1.0}}  # >=3 unusually high payments kept just below the flag level
  TX-08: {weight: 0.30, params: {dormant_days: 90, observed_days: 180, follow_days: 7}}  # dormant account wakes and pays new payees (F09)
  TX-09: {weight: 0.45, params: {share: 0.7, hours: 24, min_payees: 3}}  # >=70% of an incoming credit leaves to >=3 new payees in 24h (mule pass-through; no history needed)
  NW-01: {weight: 0.40, params: {min_payers: 3, hours: 72, established_payers: 3}}  # unrelated customers' first payments converge (F05)
  NW-02: {weight: 0.45, params: {max_hops: 4, hours: 72, tolerance: 0.10}}  # money returns to its origin through 3+ accounts (F11)

mitigations:
  MT-PAYEE: {weight: 0.60, params: {min_prior: 3, tolerance: 0.25}}  # regular payee, similar amount
  MT-RECUR: {weight: 0.50, params: {min_prior: 3, cadence_days: 30, slack_days: 3}}  # monthly cadence
  MT-KNOWN: {weight: 0.20}                                           # known device and usual city
  MT-TENURE: {weight: 0.15, params: {days: 365}}                     # long tenure
  MT-HOUSE: {weight: 0.60}                                          # household device sharing
  MT-OWN: {weight: 0.80}                                            # transfer to the customer's own account (sweep)
